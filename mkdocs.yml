site_name: DQ-lang Project
site_description: Documentation for the DQ programming language, libraries and tools
repo_url: https://github.com/nvitya/dq-lang

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.highlight

plugins:
  - search
  - monorepo
  - to-pdf:
      enabled_if_env: ENABLE_PDF_EXPORT
      output_path: pdf/dq-lang-book.pdf
      cover_subtitle: Language, Libraries and Tools
      toc_title: Contents
      toc_level: 2
      # Keep the hierarchy numbers supplied by tools/mkdocs_hooks.py.
      ordered_chapter_level: 0

hooks:
  - tools/mkdocs_hooks.py

nav:
  - DQ-lang Project:
      - DQ-lang Project: 010-project/index.md
      - DQ-lang Project Introduction: 010-project/010-introduction.md
      - Features and Design Goals: 010-project/020-features-and-goals.md
      - Getting Started: 010-project/030-getting-started.md
  - DQ Programming Language:
      - DQ Programming Language: 020-language/index.md
      - Basic Syntax: 020-language/010-basic-syntax.md
      - Basic Types and Conversions: 020-language/020-basic-types-and-conversions.md
      - Variables, Constants, References, and Scope: 020-language/030-variables-constants-references-and-scope.md
      - Expressions and Operators: 020-language/040-expressions-and-operators.md
      - Statements and Control Flow: 020-language/050-statements-and-control-flow.md
      - Functions: 020-language/060-functions.md
      - Strings and Characters: 020-language/070-strings-and-characters.md
      - Arrays and Slices: 020-language/080-arrays-and-slices.md
      - Enumerations: 020-language/090-enumerations.md
      - Structures and Unions: 020-language/100-structures-and-unions.md
      - Pointers: 020-language/110-pointers.md
      - Objects and Properties: 020-language/120-objects-and-properties.md
      - Memory Management and Ownership: 020-language/130-memory-management-and-ownership.md
      - Exceptions and Error Handling: 020-language/140-exceptions-and-error-handling.md
      - anyvalue: 020-language/150-anyvalue.md
      - Text Formatting: 020-language/160-text-formatting.md
      - Modules and Packages: 020-language/170-modules-and-packages.md
      - Attributes: 020-language/180-attributes.md
      - Compiler Directives: 020-language/190-compiler-directives.md
      - C Interoperability: 020-language/200-c-interoperability.md
      - Assembly Functions: 020-language/210-assembly-functions.md
  - DQ Compiler and Tools:
      - DQ Compiler and Tools: 030-compiler/index.md
      - Compiler and Tool Overview: 030-compiler/010-compiler-and-tool-overview.md
      - Runtime and Program Execution: 030-compiler/015-runtime-and-program-execution.md
      - Linux Development Environment: 030-compiler/020-linux-development-environment.md
      - Windows Development Environment: 030-compiler/030-windows-development-environment.md
      - Compiler Usage and Options: 030-compiler/040-compiler-usage-and-options.md
      - Project Files: 030-compiler/050-project-files.md
      - Build Process and Module Artifacts: 030-compiler/060-build-process-and-module-artifacts.md
      - Targets and Cross-Compilation: 030-compiler/070-targets-and-cross-compilation.md
      - VSCode Setup and Debugging: 030-compiler/080-vscode-setup-and-debugging.md
  - Standard Packages:
      - Standard Packages: 040-packages/index.md
      - Library Overview: 040-packages/010-library-overview-and-sys.md
      - sys: 040-packages/015-sys.md
      - print: 040-packages/020-print.md
      - file: 040-packages/040-file.md
      - json: 040-packages/050-json.md
      - threads: 040-packages/060-threads.md
      - nanonet: 040-packages/070-nanonet.md
      - Additional Standard Packages: 040-packages/080-additional-standard-packages.md
  - Appendices:
      - Example Programs: 090-appendices/010-example-programs.md
      - Building the Compiler from Source: 090-appendices/020-building-the-compiler-from-source.md
      - Contributor and Implementation Notes: 090-appendices/030-contributor-and-implementation-notes.md
      - Glossary and Index: 090-appendices/040-glossary-and-index.md

# Preserve earlier material for migration without publishing it in the new book.
exclude_docs: |
  /index-saved.md
  /feature-highlights.md
  /feature-list.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
