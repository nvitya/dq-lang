site_name: DQ Programming Language
site_description: Documentation for the DQ programming language
repo_url: https://github.com/nvitya/dq-lang

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.highlight

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Motivation: motivation.md
  - Getting Started: getting-started.md
  - Examples: examples/index.md
  - Language Guide:
      - Basics: language/basics.md
      - Types: language/types.md
      - Expressions: language/expressions.md
      - Statements: language/statements.md
      - Functions: language/functions.md
      - Objects: language/objects.md
      - Modules: language/modules.md
      - Memory and Pointers: language/memory-and-pointers.md
      - Attributes and Directives: language/attributes-and-directives.md
      - C Interoperability: language/interop.md
      - Assembly Functions: language/asm-functions.md
  - Language Reference:
      - Reference Overview: reference/index.md
      - Lexical Structure: reference/lexical-structure.md
      - Declarations and Scope: reference/declarations-and-scope.md
      - Types and Conversions: reference/types-and-conversions.md
      - Enumerations: reference/enums.md
      - Arrays and Slices: reference/arrays-and-slices.md
      - Strings and Characters: reference/strings-and-characters.md
      - anyvalue: reference/anyvalue.md
      - Structures, Pointers, and Function References: reference/structures-pointers-and-function-references.md
      - Expressions and Operators: reference/expressions-and-operators.md
      - Statements and Control Flow: reference/statements-and-control-flow.md
      - Functions: reference/functions.md
      - Objects and Properties: reference/objects-and-properties.md
      - Modules and Packages: reference/modules-and-packages.md
      - Attributes, Directives, and Interoperability: reference/attributes-directives-and-interop.md
      - Assembly Functions: reference/assembly-functions.md
  - Runtime Library:
      - Overview: rtl/overview.md
      - anyvalue: rtl/anyvalue.md
      - String Methods: rtl/strings.md
      - Text Formatting: rtl/textfmt.md
  - Standard Modules:
      - file: stdmodules/file.md
      - strutils: stdmodules/strutils.md
      - json: stdmodules/json.md
      - nanonet: stdmodules/nanonet.md
  - Compiler:
      - Getting the DQ Compiler: compiler/getting-dq-comp.md
      - Using the DQ Compiler: compiler/using-dq-comp.md
      - DQ Project Files: compiler/project-file.md
      - Cross-Compiling and Packaging: compiler/cross-compiling.md
      - Module Artifacts: compiler/dqm-format.md
  - Contributor Documentation:
      - Overview: contributing/index.md
      - Documentation Policy: contributing/documentation-policy.md
      - Coverage Inventory: contributing/coverage-inventory.md
      - Module and Interface Internals: contributing/module-and-interface-internals.md
      - Exceptions and Backtraces: contributing/exceptions-and-backtraces.md
      - Release and Cross-Build Notes: contributing/release-and-cross-builds.md
      - Writing Current DQ: contributing/writing-current-dq.md

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    unrecognized_links: warn
    anchors: warn
